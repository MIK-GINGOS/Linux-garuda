name: Sync from Garuda

on:
  schedule:
    - cron: "23 4 * * *"    # every day at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch Garuda's repository
        run: |
          git remote add upstream https://gitlab.com/garuda-linux/tools/iso-profiles.git
          git fetch upstream --tags --force --prune

      - name: Merge Garuda's master into ours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898231+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master
          git push origin master

      - name: Copy Garuda's other branches and tags
        run: |
          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream); do
            if [ "$branch" = "master" ] || [ "$branch" = "HEAD" ]; then
              continue
            fi
            git push --force origin "refs/remotes/upstream/$branch:refs/heads/$branch"
          done
          git push --force origin --tags
