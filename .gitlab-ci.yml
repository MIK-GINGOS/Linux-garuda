---
stages: [test, build, release]

include:
  - "https://gitlab.com/garuda-linux/tools/gitlab-ci-commons/-/raw/main/templates/commitizen.gitlab-ci.yml"
  - "https://gitlab.com/garuda-linux/tools/gitlab-ci-commons/-/raw/main/templates/pre-commit-nix.gitlab-ci.yml"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  BUILD_HOST: builds.garudalinux.org
  BUILD_PORT: 220
  BUILD_USER: gitlab

.ssh_setup: &ssh_setup
  before_script:
    - '[[ -z ${DEPLOY_KEY+x} ]] && echo "No deploy key available, backing off!" && exit 1'
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_KEY" >> ~/.ssh/id_ed25519
    - chmod 400 ~/.ssh/id_ed25519
    - apk add --no-cache --upgrade bash gawk openssh

pre-commit:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $MANUAL_BUILD == null

build:
  # This only runs on the default branch and when the commit message contains [deploy *]
  # and is used to deploy the ISO to the build server.
  stage: build
  image: alpine:latest
  <<: *ssh_setup
  script:
    - bash .ci/what-to-build.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[build.*\]/
    - if: $MANUAL_BUILD != null

release:
  stage: release
  image: alpine:latest
  <<: *ssh_setup
  script:
    - ssh -p "$BUILD_PORT" -o StrictHostKeyChecking=no "$BUILD_USER"@"$BUILD_HOST" "ci-trigger release $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
