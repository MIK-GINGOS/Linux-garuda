[terminal]
vt = 1

[default_session]
command = "sway --unsupported-gpu --config /etc/greetd/swayconfig > /dev/null 2>&1"
user = "greeter"

[initial_session]
# Live ISO only:
# Delay the initial autologin slightly to work around a race
# condition observed on NVIDIA hardware during testing.
command = "sh -c 'sleep 3; exec sway --unsupported-gpu'"
user = "garuda"
